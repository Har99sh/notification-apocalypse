name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, verify, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Generate static production site
        run: npm run generate

      - name: Verify static build integrity
        run: npm run check:build

      - name: Deploy exact commit to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: 4.135.0
          command: >-
            pages deploy .output/public
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'notification-apocalypse' }}
            --branch=main
            --commit-hash=${{ github.sha }}
            --commit-dirty=false

      - name: Smoke test immutable deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: npm run smoke:test -- "$DEPLOYMENT_URL"

      - name: Publish deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Notification Apocalypse deployment"
            echo
            echo "- Immutable deployment: $DEPLOYMENT_URL"
            echo "- Production URL: ${PRODUCTION_URL:-$DEPLOYMENT_URL}"
            echo "- Commit: \`$DEPLOYED_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
